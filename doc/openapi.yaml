openapi: 3.1.0
info:
  title: gouno secure agent demo
  version: 1.0.0
paths:
  /v1/agent/messages:
    post:
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [message]
              properties:
                message: {type: string, maxLength: 4000}
                language: {type: string, enum: [zh-CN, en]}
      responses:
        '200': {description: Answer with an approved knowledge citation}
        '400': {description: Invalid request or unsupported language; supported values are zh-CN and en}
        '401': {description: Missing or invalid gateway API key}
        '422': {description: Rejected input, out-of-scope query, or unsafe output}
  /v1/agent/messages/stream:
    post:
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [message]
              properties:
                message: {type: string, maxLength: 4000}
                language: {type: string, enum: [zh-CN, en]}
      responses:
        '200': {description: SSE events meta, delta, completed, error}
        '400': {description: Invalid request or unsupported language; supported values are zh-CN and en}
  /healthz:
    get: {responses: {'200': {description: Process is alive}}}
  /readyz:
    get: {responses: {'200': {description: At least one provider is configured}, '503': {description: No provider is configured}}}
components:
  securitySchemes:
    BearerAuth: {type: http, scheme: bearer}
